<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween 2026 · Three-Category Review</title>
<style>
  :root{
    --navy:#2B0F45; --navy-2:#511268; --ink:#241033; --muted:#6A5378;
    --line:#EFE2F6; --bg:#FAF6FD; --card:#FFFFFF;
    --costume:#FE3385; --inflatable:#466AE2; --skeleton:#7B02D5;
    --pos:#2FA84F; --neg:#D93025;
    --pink:#FE3385; --orange:#FBA026; --yellow:#F1EC22; --green:#57E51C; --cyan:#73FEF0; --blue:#466AE2; --purple:#7B02D5;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:0 28px}

  header.hero{position:relative;background:linear-gradient(135deg,#2B0F45 0%,#48105F 52%,#6E0D7A 100%);color:#fff;padding:0 0 34px}
  .hero h1{margin:0 0 8px;font-size:30px;letter-spacing:-.2px;font-weight:650}
  .hero p{margin:0;color:#E3D2F0;font-size:14px}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .chip{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 12px;font-size:12px;color:#F4E9FA;background:rgba(255,255,255,.07)}

  section{margin-top:34px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
  .sec-head h2{margin:0;font-size:19px;font-weight:650;color:var(--navy)}
  .sec-head span{font-size:12px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px}
  .pad{padding:18px 20px}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .kpi .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .val{font-size:26px;font-weight:680;margin-top:6px;letter-spacing:-.4px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .pos{color:var(--pos)}
  .neg{color:var(--neg)}

  .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;position:relative;overflow:hidden}
  .cat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
  .cat.c1:before{background:var(--costume)}
  .cat.c2:before{background:var(--inflatable)}
  .cat.c3:before{background:var(--skeleton)}
  .cat .tag{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .cat h3{margin:4px 0 0;font-size:16px;font-weight:640;color:var(--navy)}
  .cat .big{font-size:23px;font-weight:680;margin-top:10px}
  .cat .yoy{font-size:12px;margin-top:2px}
  .cat dl{display:grid;grid-template-columns:1fr 1fr;gap:7px 14px;margin:14px 0 0;font-size:12px}
  .cat dt{color:var(--muted)}
  .cat dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}

  .takeaways{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .ta{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .ta .num{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .ta h4{margin:0 0 8px;font-size:15px;color:var(--navy);font-weight:640;line-height:1.35}
  .ta p{margin:0;font-size:13px;color:#3B2A4A}

  .bar-row{display:grid;grid-template-columns:132px 1fr 78px;align-items:center;gap:12px;padding:5px 0;font-size:13px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .bar-track{height:10px;background:#F4EAF9;border-radius:4px;overflow:hidden;display:flex;gap:2px}
  .bar-fill{height:100%;border-radius:3px}
  .bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-weight:600;color:var(--navy);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);background:#FCF5FE;white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid #F6EDFA;vertical-align:middle}
  tbody tr:hover{background:#FDF6FF}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
  .pill.costume{color:#D0166A;border-color:#FFC9DE;background:#FFECF4}
  .pill.inflatable{color:#2E4FBF;border-color:#CBD4FA;background:#EDF0FE}
  .pill.skeleton{color:#6901BC;border-color:#E2C8FA;background:#F5EBFF}
  .pill.ip{color:#511268;border-color:#E2C8FA;background:#F7EDFF}
  .rank{color:var(--muted);font-variant-numeric:tabular-nums}

  .filters{position:sticky;top:0;z-index:20;background:rgba(250,246,253,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 0 12px;margin-top:26px}
  .filter-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  select,input[type=text]{appearance:none;width:100%;padding:8px 10px;font-size:13px;color:var(--ink);background:#fff;border:1px solid #E4D5EE;border-radius:7px;font-family:inherit}
  select:disabled{background:#F5EDFA;color:#9B87AA;cursor:not-allowed}
  select:focus,input:focus{outline:2px solid #F7A9C8;outline-offset:1px}
  .filter-actions{display:flex;align-items:flex-end;gap:10px}
  button{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:7px;cursor:pointer;border:1px solid #E4D5EE;background:#fff;color:var(--navy)}
  button:hover{background:#FDF3FF}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:linear-gradient(135deg,#FE3385,#F42C6D);border-color:#FE3385;color:#fff}
  button.primary:hover{background:#E01F6F}

  .explore-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .mini .l{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .mini .v{font-size:19px;font-weight:660;margin-top:4px;letter-spacing:-.3px}

  .table-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 2px 10px;flex-wrap:wrap}
  .table-tools .left{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--navy);font-weight:600}
  .table-tools .right{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .table-box{overflow:auto;max-height:660px;border-radius:10px}
  thead th.sortable{cursor:pointer;user-select:none}
  thead th.sortable:hover{color:var(--purple);background:#FDF3FF}
  thead th .arrow{font-size:10px;color:#B8A3C8;margin-left:4px}
  thead.sticky th{position:sticky;top:0;z-index:3;background:#FCF5FE}
  td.title{max-width:400px}
  .ellip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pager{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 0;font-size:12px;color:var(--muted)}
  .pager .btns{display:flex;gap:8px}

  .method{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .method h4{margin:0 0 10px;font-size:14px;color:var(--navy)}
  .method ul{margin:0;padding-left:18px;font-size:13px;color:#3B2A4A}
  .method li{margin-bottom:7px}

  footer{margin:34px 0 40px;font-size:12px;color:var(--muted)}

  .ribbon{display:flex;height:6px;width:100%}
  .ribbon span{flex:1}
  .ribbon span:nth-child(1){background:#FE3385}
  .ribbon span:nth-child(2){background:#FBA026}
  .ribbon span:nth-child(3){background:#F1EC22}
  .ribbon span:nth-child(4){background:#57E51C}
  .ribbon span:nth-child(5){background:#73FEF0}
  .ribbon span:nth-child(6){background:#466AE2}
  .ribbon span:nth-child(7){background:#7B02D5}
  .brandbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:22px 0 26px}
  .logo-badge{background:#fff;border-radius:14px;padding:9px 16px;display:inline-flex;align-items:center;box-shadow:0 8px 22px rgba(18,0,30,.28)}
  .logo-badge img{height:40px;width:auto;display:block}
  .brandtag{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#DCC8EC}

  #gate{position:fixed;inset:0;z-index:60;background:linear-gradient(150deg,#2B0F45 0%,#48105F 55%,#6E0D7A 100%);display:flex;align-items:center;justify-content:center;padding:24px}
  .gate-card{background:#fff;border-radius:18px;padding:30px 32px;width:100%;max-width:410px;box-shadow:0 26px 64px rgba(0,0,0,.38);text-align:center}
  .gate-logo{height:42px;margin:0 auto 18px;display:block}
  .gate-card h2{margin:0 0 6px;font-size:18px;color:#2B0F45;font-weight:660}
  .gate-card p{margin:0 0 18px;font-size:13px;color:#6A5378}
  .gate-card input{text-align:center;letter-spacing:.14em;font-size:16px;padding:11px 12px}
  .gate-card button{width:100%;margin-top:10px;padding:11px 14px;font-size:14px}
  .gate-err{margin-top:10px;font-size:12.5px;color:#D0166A;min-height:17px}
  .gate-foot{margin-top:14px;font-size:11px;color:#9B87AA}

  @media (max-width:1080px){
    .kpis,.cats,.takeaways,.method{grid-template-columns:1fr 1fr}
    .filter-grid{grid-template-columns:repeat(3,1fr)}
    .explore-kpis{grid-template-columns:repeat(3,1fr)}
    .split{grid-template-columns:1fr;gap:20px}
  }
  @media (max-width:680px){
    .kpis,.cats,.takeaways,.method,.filter-grid,.explore-kpis{grid-template-columns:1fr}
    .wrap{padding:0 16px}
    .split{grid-template-columns:1fr;gap:16px}
    .bar-row{grid-template-columns:84px 1fr 46px;gap:8px;font-size:12px}
  }
</style>
</head>

<script>
/* the app boots only after the encrypted payload is unlocked */
function startApp(DATA){

/* ====== Helpers ====== */
const fmtMoney = v => v>=1e8 ? '$'+(v/1e6).toFixed(1)+'M' : v>=1e6 ? '$'+(v/1e6).toFixed(2)+'M' : v>=1e3 ? '$'+(v/1e3).toFixed(0)+'K' : '$'+Math.round(v);
const fmtFull  = v => '$'+Math.round(v).toLocaleString('en-US');
const pct      = v => (v*100).toFixed(1)+'%';
const yoyTxt   = v => v==null ? '—' : (v>0?'+':'')+(v*100).toFixed(1)+'%';
const yoyCls   = v => v==null ? 'muted' : v>0 ? 'pos' : v<0 ? 'neg' : 'muted';
const esc      = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS = ['Costume','Inflatables','Skeleton'];
const CAT_LABEL = {Costume:'Costume', Inflatables:'Inflatables', Skeleton:'Skeleton decor'};
const CAT_PILL  = {Costume:'costume', Inflatables:'inflatable', Skeleton:'skeleton'};
const GENDERS = ['Women','Men','Girls','Boys','Other'];

const state = {cat:'all', aud:'all', theme:'all', ip:'all', band:'all', size:'all', ageset:'all',
               q:'', rankLimit:0, sort:'sales', dir:-1, page:1, pageSize:60};

/* Precompute YoY per row */
DATA.forEach(r => { r.yoy = (r.prev && r.prev > 0) ? (r.sales - r.prev) / r.prev : null; });

/* ====== Aggregation ====== */
function agg(rows){
  const sales = rows.reduce((a,r)=>a+r.sales,0);
  const prev  = rows.reduce((a,r)=>a+r.prev,0);
  const units = rows.reduce((a,r)=>a+r.units,0);
  const top10 = rows.slice().sort((a,b)=>b.sales-a.sales).slice(0,10).reduce((a,r)=>a+r.sales,0);
  return {n:rows.length, sales, prev, units,
          yoy: prev>0 ? (sales-prev)/prev : null,
          asp: units>0 ? sales/units : 0,
          avg: rows.length ? sales/rows.length : 0,
          top10: sales>0 ? top10/sales : 0};
}

/* ====== Header blocks ====== */
function renderHead(){
  const all = agg(DATA);
  const byCat = {}; CATS.forEach(c => byCat[c] = agg(DATA.filter(r=>r.cat===c)));

  document.getElementById('chipPanel').textContent = fmtMoney(all.sales)+' total sales · '+yoyTxt(all.yoy)+' YoY';

  const cards = [
    ['Panel sales, Aug–Oct 2026', fmtMoney(all.sales),
      '<span class="'+yoyCls(all.yoy)+'">'+yoyTxt(all.yoy)+' YoY</span> · vs '+fmtMoney(all.prev)+' last year'],
    ['SKUs in the panel', all.n.toLocaleString('en-US'),
      'Costume '+byCat.Costume.n+' · Inflatables '+byCat.Inflatables.n+' · Skeleton '+byCat.Skeleton.n],
    ['Costume share of panel', pct(byCat.Costume.sales/all.sales),
      fmtMoney(byCat.Costume.sales)+' of '+fmtMoney(all.sales)],
    ['Top-10 concentration', pct(byCat.Costume.top10),
      'Costume '+pct(byCat.Costume.top10)+' · Skeleton '+pct(byCat.Skeleton.top10)+' · Inflatables '+pct(byCat.Inflatables.top10)]
  ];
  document.getElementById('kpiHead').innerHTML = cards.map(([l,v,s]) =>
    '<div class="kpi"><div class="label">'+l+'</div><div class="val">'+v+'</div><div class="sub">'+s+'</div></div>').join('');

  const cls = {Costume:'c1', Inflatables:'c2', Skeleton:'c3'};
  const lead = {Costume:'Spooktacular Creations · 12.8%', Inflatables:'Joiedomi · 21.3%', Skeleton:'JOYIN · 23.7%'};
  const brands = {Costume:614, Inflatables:118, Skeleton:42};
  const newShare = {Costume:'15.2%', Inflatables:'21.9%', Skeleton:'12.7%'};

  document.getElementById('catCards').innerHTML = CATS.map(c => {
    const a = byCat[c];
    return '<div class="cat '+cls[c]+'">' +
      '<div class="tag">'+pct(a.sales/all.sales)+' of panel sales</div>' +
      '<h3>'+CAT_LABEL[c]+'</h3>' +
      '<div class="big">'+fmtMoney(a.sales)+'</div>' +
      '<div class="yoy '+yoyCls(a.yoy)+'">'+yoyTxt(a.yoy)+' YoY</div>' +
      '<dl>' +
        '<dt>SKUs</dt><dd>'+a.n+'</dd>' +
        '<dt>Avg per SKU</dt><dd>'+fmtMoney(a.avg)+'</dd>' +
        '<dt>ASP</dt><dd>$'+a.asp.toFixed(2)+'</dd>' +
        '<dt>Top-10 share</dt><dd>'+pct(a.top10)+'</dd>' +
        '<dt>Brands</dt><dd>'+brands[c]+'</dd>' +
        '<dt>New-product share</dt><dd>'+newShare[c]+'</dd>' +
        '<dt>Lead brand</dt><dd style="font-size:11.5px">'+lead[c]+'</dd>' +
      '</dl></div>';
  }).join('');
}

/* ====== Structure bars: rebuilt from the current selection ====== */
function renderBars(){
  const rows = filtered();
  const colors = {Costume:'#FE3385', Inflatables:'#466AE2', Skeleton:'#7B02D5'};
  const total = rows.reduce((a,r)=>a+r.sales,0);
  const present = CATS.filter(c => rows.some(r => r.cat===c));
  const byCat = {}; CATS.forEach(c => byCat[c] = agg(rows.filter(r=>r.cat===c)));

  const scope = document.getElementById('barsScope');
  if(scope){
    const catTxt = state.cat==='all' ? 'All categories' : CAT_LABEL[state.cat];
    const audTxt = (state.aud==='all' || state.cat!=='Costume') ? 'all audiences' : state.aud;
    scope.textContent = catTxt + ' · ' + audTxt + ' · ' + (rows.length ? fmtMoney(total) + ' across ' + rows.length.toLocaleString('en-US') + ' SKUs' : 'no rows') + ' · rebuilt live';
  }

  const share = document.getElementById('shareBars');
  const price = document.getElementById('priceBars');

  if(!rows.length){
    share.innerHTML = '<p class="muted" style="font-size:13px">No SKU matches these filters.</p>';
    price.innerHTML = '';
    return;
  }

  share.innerHTML = present.map(c => {
    const sh = total ? byCat[c].sales/total : 0;
    return '<div class="bar-row"><span>'+CAT_LABEL[c]+'</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:'+(sh*100).toFixed(1)+'%;background:'+colors[c]+'"></div></div>' +
      '<span class="bar-val">'+pct(sh)+'</span></div>';
  }).join('') +
  '<div class="bar-row" style="border-top:1px solid #EEF3F8;margin-top:6px;padding-top:8px"><span class="muted">Selection total</span>' +
  '<div class="bar-track"><div class="bar-fill" style="width:100%;background:#C9B0DC"></div></div>' +
  '<span class="bar-val">'+fmtMoney(total)+'</span></div>';

  const bands = ['<$10','$10–19.99','$20–29.99','$30–49.99','$50–69.99','$70+'];
  const bandRows = bands.map(b => {
    const seg = present.map(c => {
      const s = rows.filter(r => r.cat===c && r.band===b).reduce((a,r)=>a+r.sales,0);
      return byCat[c].sales ? s/byCat[c].sales : 0;
    });
    return '<div class="bar-row"><span class="muted">'+b+'</span>' +
      '<div class="bar-track">' +
        present.map((c,i) => '<div class="bar-fill" style="width:'+(seg[i]*100).toFixed(1)+'%;background:'+colors[c]+'"></div>').join('') +
      '</div>' +
      '<span class="bar-val">'+seg.map(v => (v*100).toFixed(0)).join('/')+'</span></div>';
  }).join('');

  price.innerHTML = bandRows +
    '<div style="font-size:11px;color:var(--muted);margin-top:8px">Bars: ' +
    present.map(c => CAT_LABEL[c]).join(' / ') +
    ' · each value is % of that category’s sales in the current selection</div>';
}
/* ====== Cascading filter options ====== */
function optionsFor(){
  const base = state.cat==='all' ? DATA : DATA.filter(r=>r.cat===state.cat);
  const set = (arr) => Array.from(new Set(arr.filter(v=>v!=='' && v!=null))).sort((a,b)=>a.localeCompare(b));
  return {
    aud:   state.cat==='all' ? [] : (state.cat==='Costume' ? GENDERS : []),
    theme: set(base.map(r => r.theme)),
    ip:    state.cat==='Costume' ? set(base.map(r => r.ip)) : (state.cat==='all' ? set(DATA.filter(r=>r.cat==='Costume').map(r=>r.ip)) : []),
    band:  set(DATA.map(r=>r.band)),
    size:  set((state.cat==='all' ? DATA.filter(r=>r.cat!=='Costume') : base.filter(r=>r.cat!=='Costume')).map(r=>r.size))
  };
}

function fillSelect(id, values, allLabel, keepValue){
  const el = document.getElementById(id);
  el.innerHTML = '<option value="all">'+allLabel+'</option>' +
    values.map(v => '<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  if (keepValue && values.indexOf(keepValue) > -1) el.value = keepValue; else el.value = 'all';
  el.disabled = values.length === 0;
}

function refreshFilters(){
  const o = optionsFor();
  fillSelect('fAud',   o.aud,   'All genders',        state.aud);
  fillSelect('fTheme', o.theme, 'All themes',         state.theme);
  fillSelect('fIp',    o.ip,    'All IP families',    state.ip);
  fillSelect('fBand',  o.band,  'All price bands',    state.band);
  fillSelect('fSize',  o.size,  'All size bands',     state.size);
}

/* ====== Apply filters ====== */
function filtered(){
  const q = state.q.trim().toLowerCase();
  let rows = DATA.filter(r => {
    if (state.cat !== 'all' && r.cat !== state.cat) return false;
    if (state.aud !== 'all' && r.aud !== state.aud) return false;
    if (state.theme !== 'all' && r.theme !== state.theme) return false;
    if (state.ip !== 'all' && r.ip !== state.ip) return false;
    if (state.band !== 'all' && r.band !== state.band) return false;
    if (state.size !== 'all' && r.size !== state.size) return false;
    if (state.ageset === 'new' && !r.isNew) return false;
    if (state.ageset === 'existing' && r.isNew) return false;
    if (q && !(r.title.toLowerCase().includes(q) || r.brand.toLowerCase().includes(q))) return false;
    return true;
  });

  rows.sort((a,b) => {
    let va, vb;
    if (state.sort === 'yoy'){ va = a.yoy==null?-9e9:a.yoy; vb = b.yoy==null?-9e9:b.yoy; }
    else if (state.sort === 'sales'){ va = a.sales; vb = b.sales; }
    else if (state.sort === 'asp'){ va = a.asp; vb = b.asp; }
    else { va = (a[state.sort]||'').toString().toLowerCase(); vb = (b[state.sort]||'').toString().toLowerCase(); }
    if (va < vb) return -1*state.dir;
    if (va > vb) return 1*state.dir;
    return 0;
  });

  rows.forEach((r,i) => r._rank = i + 1);
  if (state.rankLimit > 0) rows = rows.filter(r => r._rank <= state.rankLimit);
  return rows;
}

/* ====== Render: KPIs and table ====== */
function renderExplore(){
  const rows = filtered();
  const a = agg(rows);

  const tiles = [
    ['SKUs selected', rows.length.toLocaleString('en-US'), ''],
    ['Sales', fmtMoney(a.sales), a.sales? pct(a.sales/agg(DATA).sales)+' of panel<br>':'' ],
    ['2025 same window', fmtMoney(a.prev), ''],
    ['YoY', yoyTxt(a.yoy), ''],
    ['Avg per SKU', fmtMoney(a.avg), ''],
    ['Top-10 share', a.sales? pct(a.top10):'—', '']
  ];
  document.getElementById('exploreKpis').innerHTML = tiles.map(([l,v,s]) =>
    '<div class="mini"><div class="l">'+l+'</div><div class="v '+ (l==='YoY'?yoyCls(a.yoy):'') +'">'+v+'</div>' +
    (s?'<div class="l" style="margin-top:4px;text-transform:none;letter-spacing:0">'+s+'</div>':'') + '</div>').join('');

  document.getElementById('rowCount').textContent = rows.length.toLocaleString('en-US') + ' SKUs match';

  const pageSize = state.pageSize === 0 ? rows.length : state.pageSize;
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * pageSize;
  const slice = rows.slice(start, start + pageSize);

  const tbody = document.querySelector('#dataTable tbody');
  if (!slice.length){
    tbody.innerHTML = '<tr><td colspan="10" style="padding:26px;text-align:center;color:#5C6B7A">No SKU matches these filters.</td></tr>';
  } else {
    tbody.innerHTML = slice.map(r => {
      const aud = r.aud ? r.aud : '<span class="muted">—</span>';
      const theme = r.ip ? '<span class="muted">—</span>' : esc(r.theme || 'Unlabeled');
      const ip = r.ip ? '<span class="pill ip">'+esc(r.ip)+'</span>' : '<span class="muted">—</span>';
      return '<tr>' +
        '<td class="rank">'+r._rank+'</td>' +
        '<td><span class="pill '+CAT_PILL[r.cat]+'">'+CAT_LABEL[r.cat]+'</span></td>' +
        '<td>'+aud+'</td>' +
        '<td>'+theme+'</td>' +
        '<td>'+ip+'</td>' +
        '<td>'+esc(r.brand)+'</td>' +
        '<td class="title"><span class="ellip" title="'+esc(r.title)+'">'+esc(r.title)+'</span></td>' +
        '<td class="num">'+fmtFull(r.sales)+'</td>' +
        '<td class="num '+yoyCls(r.yoy)+'">'+yoyTxt(r.yoy)+'</td>' +
        '<td class="num">'+(r.asp?('$'+r.asp.toFixed(2)):'—')+'</td>' +
      '</tr>';
    }).join('');
  }

  document.getElementById('pageInfo').textContent =
    'Showing '+(rows.length? (start+1) : 0)+'–'+Math.min(start+pageSize, rows.length)+' of '+rows.length.toLocaleString('en-US')+' · page '+state.page+' / '+pages;
  document.getElementById('btnPrev').disabled = state.page <= 1;
  document.getElementById('btnNext').disabled = state.page >= pages;

  document.getElementById('selNote').textContent =
    (state.aud!=='all' && state.cat==='all' ? 'Gender applies to costume only · ' : '') +
    'Sorted by '+ ({rank:'rank', cat:'category', aud:'gender', theme:'theme', ip:'character/IP', brand:'brand', sales:'sales', yoy:'YoY', asp:'ASP'}[state.sort] || 'sales') +
    (state.dir===1 ? ' ↑' : ' ↓');

  document.querySelectorAll('#dataTable thead th.sortable').forEach(th => {
    const arrow = th.querySelector('.arrow');
    arrow.textContent = (th.dataset.key === state.sort) ? (state.dir === 1 ? '▲' : '▼') : '';
  });

  renderBars();
}

/* ====== Events ====== */
function bind(){
  document.getElementById('fCat').addEventListener('change', e => {
    state.cat = e.target.value; state.aud='all'; state.theme='all'; state.ip='all'; state.size='all';
    state.page = 1; refreshFilters(); renderExplore();
  });
  document.getElementById('fAud').addEventListener('change', e => { state.aud = e.target.value; state.page = 1; renderExplore(); });
  document.getElementById('fTheme').addEventListener('change', e => { state.theme = e.target.value; state.page = 1; renderExplore(); });
  document.getElementById('fIp').addEventListener('change', e => { state.ip = e.target.value; state.page = 1; renderExplore(); });
  document.getElementById('fBand').addEventListener('change', e => { state.band = e.target.value; state.page = 1; renderExplore(); });
  document.getElementById('fSize').addEventListener('change', e => { state.size = e.target.value; state.page = 1; renderExplore(); });
  document.getElementById('fNew').addEventListener('change', e => { state.ageset = e.target.value; state.page = 1; renderExplore(); });
  document.getElementById('fRank').addEventListener('change', e => { state.rankLimit = Number(e.target.value); state.page = 1; renderExplore(); });
  document.getElementById('fPageSize').addEventListener('change', e => { state.pageSize = Number(e.target.value); state.page = 1; renderExplore(); });

  let qTimer = null;
  document.getElementById('fQ').addEventListener('input', e => {
    const val = e.target.value;
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = val; state.page = 1; renderExplore(); }, 180);
  });

  document.querySelectorAll('#dataTable thead th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (key === 'rank'){ state.sort = 'sales'; state.dir = -1; }
      else if (state.sort === key){ state.dir *= -1; }
      else { state.sort = key; state.dir = (key==='sales'||key==='yoy'||key==='asp') ? -1 : 1; }
      state.page = 1; renderExplore();
    });
  });

  document.getElementById('btnPrev').addEventListener('click', () => { state.page--; renderExplore(); });
  document.getElementById('btnNext').addEventListener('click', () => { state.page++; renderExplore(); });

  document.getElementById('btnReset').addEventListener('click', () => {
    state.cat='all'; state.aud='all'; state.theme='all'; state.ip='all'; state.band='all';
    state.size='all'; state.ageset='all'; state.q=''; state.rankLimit=0; state.page=1;
    state.sort='sales'; state.dir=-1;
    document.getElementById('fCat').value='all';
    document.getElementById('fNew').value='all';
    document.getElementById('fRank').value='0';
    document.getElementById('fQ').value='';
    refreshFilters(); renderExplore();
  });
}

/* ====== Boot ====== */
renderHead();
refreshFilters();
bind();
renderExplore();
}
window.__startApp = startApp;
</script>
